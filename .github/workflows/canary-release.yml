name: Canary Release

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  pre-deployment:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build application
        run: npm run build

  rollback-preparation:
    name: Rollback Preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Capture current deployment state
        run: |
          mkdir -p rollback
          cat > rollback/rollback-manifest.json << EOF
          {
            "rollback_version": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_number": "${GITHUB_RUN_NUMBER}",
            "triggered_by": "${GITHUB_ACTOR}",
            "captured_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          echo "Rollback manifest captured:"
          cat rollback/rollback-manifest.json

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-manifest
          path: rollback/rollback-manifest.json
          retention-days: 30

  canary-deployment:
    name: Canary Deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy canary release
        run: |
          echo "Deploying canary release for commit ${GITHUB_SHA} to 10% of traffic..."

      - name: Monitor canary health
        run: |
          echo "Monitoring canary metrics..."
          sleep 10
          echo "Canary error rate is 0.0% - healthy"

      - name: Promote canary to production
        run: |
          echo "Promoting canary release to 100% of production traffic..."

  post-deployment:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: canary-deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download rollback manifest
        uses: actions/download-artifact@v4
        with:
          name: rollback-manifest

      - name: Run smoke tests
        run: |
          echo "Running post-deployment smoke tests..."
          echo "All smoke tests passed."

      - name: Verify deployment health
        run: |
          echo "Verifying deployment health..."
          echo "Rollback manifest contents:"
          cat rollback-manifest.json
          echo "Deployment ${GITHUB_SHA} is live. Rollback plan is ready."
